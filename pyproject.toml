[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing-detector"
version = "0.1.0"
description = "A real, usable phishing URL and email detector: lexical feature extraction, a scikit-learn classifier, and a rule-based email heuristic scorer, with a CLI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Adeev Mardia" }]
dependencies = [
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "numpy>=1.24",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
phishing-detector = "phishing_detector.cli:main"

[tool.setuptools.packages.find]
include = ["phishing_detector*"]
